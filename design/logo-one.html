<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><title>Logo 定版</title>
<style>
body{font-family:Inter,"Microsoft YaHei",Arial,sans-serif;background:linear-gradient(160deg,#eef2f5,#e7ecf0);color:#16191e;margin:0;padding:50px 32px;-webkit-font-smoothing:antialiased;text-align:center}
h1{font-size:22px;margin:0 0 8px}.sub{color:#5b656d;font-size:13px;margin-bottom:40px}
.big img{width:140px;height:140px;filter:drop-shadow(0 10px 24px rgba(22,25,30,.18));margin:0 20px}
.sizes{display:flex;gap:24px;justify-content:center;align-items:flex-end;margin:36px 0}
.sizes img{filter:drop-shadow(0 6px 14px rgba(22,25,30,.14))}
.s80{width:80px;height:80px}.s48{width:48px;height:48px}.s32{width:32px;height:32px}.s20{width:20px;height:20px}
.scene{display:flex;gap:20px;justify-content:center;margin-top:30px;flex-wrap:wrap}
.titlebar{display:inline-flex;align-items:center;gap:9px;background:#fff;border:1px solid #e0e4e8;border-radius:10px;padding:10px 14px;font-weight:650;font-size:14px}
.titlebar img{width:20px;height:20px}
.chip{border-radius:12px;padding:14px 20px;display:inline-flex;align-items:center;gap:10px;font-size:12px}
.chip.dark{background:#1b2530;color:#aeb5bc}.chip.dark img{width:34px;height:34px}
</style></head><body>
<h1>TaskList · Logo 定版</h1>
<div class="sub">纯白底 · 一个清单：竹青打钩（完成）· 靛青待办 · 灰色划掉。零多余装饰。</div>
<div class="big"><img src="final.svg"/></div>
<div class="sizes">
  <img class="s80" src="final.svg"/><img class="s48" src="final.svg"/><img class="s32" src="final.svg"/><img class="s20" src="final.svg"/>
</div>
<div class="scene">
  <div class="titlebar"><img src="final.svg"/>任务清单</div>
  <div class="chip dark"><img src="final.svg"/>深色任务栏</div>
</div>
</body></html>
