<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><title>白底 Logo</title>
<style>
body{font-family:Inter,"Microsoft YaHei",Arial,sans-serif;background:linear-gradient(160deg,#eef2f5,#e7ecf0);color:#16191e;margin:0;padding:44px 32px;-webkit-font-smoothing:antialiased}
h1{font-size:22px;margin:0 0 6px}.sub{color:#5b656d;font-size:13px;margin-bottom:30px}
.row{display:flex;gap:36px;flex-wrap:wrap}
.card{background:#fff;border:1px solid #e0e4e8;border-radius:18px;padding:26px 30px;box-shadow:0 10px 40px rgba(22,25,30,.10);width:360px}
.card h2{font-size:16px;margin:0 0 4px}.card .d{color:#5b656d;font-size:12.5px;margin:6px 0 20px;line-height:1.5}
.big{display:flex;gap:18px;align-items:flex-end;margin-bottom:18px}
.big img{filter:drop-shadow(0 6px 16px rgba(22,25,30,.16))}
.s104{width:104px;height:104px}.s56{width:56px;height:56px}.s32{width:32px;height:32px}
.onbg{display:flex;gap:14px;margin-bottom:14px}
.chip{flex:1;border-radius:12px;padding:14px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:11px}
.chip.light{background:#f0f3f6;color:#5b656d}
.chip.dark{background:#1b2530;color:#aeb5bc}
.chip img{width:34px;height:34px}
.titlebar{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #e0e4e8;border-radius:10px;padding:10px 13px;font-weight:650;font-size:14px}
.titlebar img{width:20px;height:20px}
</style></head><body>
<h1>TaskList · 白底铺满版（白纸即图标 + 靛青夹头 + 清单）</h1>
<div class="sub">整个 logo 是白纸铺满，顶部靛青夹头，纸上竹青对勾+靛青待办条。含浅色/深色背景验证（白底图标在深色任务栏上很跳，浅色上有细描边不糊）。</div>
<div class="row">
  <div class="card"><h2>W1 · 清单三行</h2>
    <div class="d">白纸铺满 + 靛青夹头 + 三行清单（竹青勾+两条待办）。清爽、像提醒事项。</div>
    <div class="big"><img class="s104" src="w1.svg"/><img class="s56" src="w1.svg"/><img class="s32" src="w1.svg"/></div>
    <div class="onbg"><div class="chip light"><img src="w1.svg"/>浅色背景</div><div class="chip dark"><img src="w1.svg"/>深色任务栏</div></div>
    <div class="titlebar"><img src="w1.svg"/>任务清单</div>
  </div>
  <div class="card"><h2>W2 · 清单两行（更简洁）</h2>
    <div class="d">两行更大更透气，夹头带一点朱做夹扣点睛（克制）。最简洁大气。</div>
    <div class="big"><img class="s104" src="w2.svg"/><img class="s56" src="w2.svg"/><img class="s32" src="w2.svg"/></div>
    <div class="onbg"><div class="chip light"><img src="w2.svg"/>浅色背景</div><div class="chip dark"><img src="w2.svg"/>深色任务栏</div></div>
    <div class="titlebar"><img src="w2.svg"/>任务清单</div>
  </div>
</div>
</body></html>
