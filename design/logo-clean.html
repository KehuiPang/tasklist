<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><title>Logo 干净版</title>
<style>
body{font-family:Inter,"Microsoft YaHei",Arial,sans-serif;background:linear-gradient(160deg,#eef2f5,#e7ecf0);color:#16191e;margin:0;padding:44px 32px;-webkit-font-smoothing:antialiased}
h1{font-size:22px;margin:0 0 6px}.sub{color:#5b656d;font-size:13px;margin-bottom:32px}
.row{display:flex;gap:36px;flex-wrap:wrap}
.card{background:#fff;border:1px solid #e0e4e8;border-radius:18px;padding:26px 30px;box-shadow:0 10px 40px rgba(22,25,30,.10);width:340px}
.card h2{font-size:16px;margin:0 0 4px}.card .d{color:#5b656d;font-size:12.5px;margin:6px 0 20px;line-height:1.5}
.big{display:flex;gap:18px;align-items:flex-end;margin-bottom:20px}
.big img{filter:drop-shadow(0 8px 18px rgba(22,25,30,.20))}
.s104{width:104px;height:104px}.s56{width:56px;height:56px}.s32{width:32px;height:32px}
.titlebar{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #e0e4e8;border-radius:10px;padding:10px 13px;font-weight:650;font-size:14px;margin-bottom:11px}
.titlebar img{width:20px;height:20px}
.tray{display:inline-flex;align-items:center;gap:8px;background:#f4f6f8;border:1px solid #e0e4e8;border-radius:9px;padding:8px 13px;font-size:12.5px;color:#5b656d}
.tray img{width:16px;height:16px}
</style></head><body>
<h1>TaskList · Logo 定版（去掉红点，更协调）</h1>
<div class="sub">回到你喜欢的两版，去掉右下角那个不协调的红点。玄墨→靛青渐变底 + 竹青对勾（完成感），干净。</div>
<div class="row">
  <div class="card"><h2>③ 清单三条</h2>
    <div class="d">三行清单，首行竹青对勾=已完成，下两行待办圈。直白清爽，一眼是"清单"。</div>
    <div class="big"><img class="s104" src="c3.svg"/><img class="s56" src="c3.svg"/><img class="s32" src="c3.svg"/></div>
    <div class="titlebar"><img src="c3.svg"/>任务清单</div>
    <div class="tray"><img src="c3.svg"/>托盘 16px</div>
  </div>
  <div class="card"><h2>④ 剪贴板</h2>
    <div class="d">剪贴板+纸面清单，一条竹青对勾+两条待办。具象、一眼看懂是待办清单。</div>
    <div class="big"><img class="s104" src="c4.svg"/><img class="s56" src="c4.svg"/><img class="s32" src="c4.svg"/></div>
    <div class="titlebar"><img src="c4.svg"/>任务清单</div>
    <div class="tray"><img src="c4.svg"/>托盘 16px</div>
  </div>
</div>
</body></html>
