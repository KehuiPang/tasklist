<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a6b8c"/><stop offset="1" stop-color="#1b2530"/>
    </linearGradient>
  </defs>
  <!-- 托盘版：渐变圆角方块铺满画布，剪贴板保持原版舒展比例(纸面小一圈四周留深边) -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#g4)"/>
  <!-- 夹头 -->
  <rect x="106" y="52" width="44" height="20" rx="9" fill="#cdd6dd"/>
  <!-- 纸面：居中，四周留深色边距，比例舒展 -->
  <rect x="76" y="64" width="104" height="128" rx="20" fill="#F4F6F8"/>
  <!-- 纸上清单：一个青勾 + 两行(圈+条) -->
  <g stroke-linecap="round">
    <path d="M92 104 l9 10 l17 -20" fill="none" stroke="#4e7a63" stroke-width="9" stroke-linejoin="round"/>
    <rect x="128" y="100" width="36" height="9" rx="4.5" fill="#274A63" opacity="0.5"/>
    <circle cx="100" cy="140" r="9" fill="none" stroke="#274A63" stroke-width="6.5"/>
    <rect x="128" y="135" width="36" height="9" rx="4.5" fill="#274A63" opacity="0.85"/>
    <circle cx="100" cy="170" r="9" fill="none" stroke="#274A63" stroke-width="6.5"/>
    <rect x="128" y="165" width="26" height="9" rx="4.5" fill="#274A63" opacity="0.85"/>
  </g>
  <!-- 夹头一点朱火种 -->
  <circle cx="128" cy="62" r="6.5" fill="#C05F3C"/>
</svg>
