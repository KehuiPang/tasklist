name: Release

# 打 tag（v1.0.0 这种）时自动触发：构建 Windows 安装包并发布到 GitHub Releases
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 允许创建 Release、上传产物

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 图标（build/tray-*.png、winicon-*.png、icon.ico）已随仓库提交，CI 直接使用，
      # 无需在 CI 里跑 Electron 渲染，更稳定。

      - name: 构建并发布安装包
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
