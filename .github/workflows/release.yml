name: Release

# 打 tag（v1.0.0 这种）时自动触发：三平台并行构建并发布到 GitHub Releases
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 允许创建 Release、上传产物

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      # 图标（build/tray-*.png、winicon-*.png、icon.ico、icon.png）已随仓库提交，
      # CI 直接使用，无需在 CI 里跑 Electron 渲染，更稳定跨平台。

      - name: 构建并发布安装包
        run: npx electron-builder --${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
