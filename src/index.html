<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskList</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 收起后显示的小竖条 -->
  <div id="collapsedStrip" class="collapsed-strip hidden">
    <span class="strip-icon">✓</span>
  </div>

  <div id="app" class="app">
    <!-- 标题栏（可拖动） -->
    <div class="titlebar" id="titlebar">
      <div class="title-left">
        <img class="logo-svg" src="logo.svg" alt="" />
        <span class="title-text" data-i18n="appTitle">任务清单</span>
      </div>
      <div class="title-actions">
        <button class="tb-btn" id="btnPin" data-i18n-title="tip_pin" title="置顶">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6M10 4l-.5 6.5L6.5 13h11l-3-2.5L14 4M12 13v7"/></svg>
        </button>
        <button class="tb-btn" id="btnSettings" data-i18n-title="tip_settings" title="设置">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M13.3 2.5l.4 2.4 1.9.8 2-1.4 1.6 1.6-1.4 2 .8 1.9 2.4.4v2.4l-2.4.4-.8 1.9 1.4 2-1.6 1.6-2-1.4-1.9.8-.4 2.4h-2.6l-.4-2.4-1.9-.8-2 1.4-1.6-1.6 1.4-2-.8-1.9-2.4-.4V10.9l2.4-.4.8-1.9-1.4-2 1.6-1.6 2 1.4 1.9-.8.4-2.4z"/><circle cx="12" cy="12" r="3.2"/></svg>
        </button>
        <button class="tb-btn" id="btnCollapse" data-i18n-title="tip_collapse" title="贴边收起">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4v16M10 12h9M15 8l4 4-4 4"/></svg>
        </button>
        <button class="tb-btn" id="btnMin" data-i18n-title="tip_min" title="最小化到托盘">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 12h12"/></svg>
        </button>
      </div>
    </div>

    <!-- 快速记录 -->
    <div class="quick-add">
      <input type="text" id="quickInput" data-i18n-ph="quick_ph" placeholder="记点什么… 回车添加" autocomplete="off" />
    </div>

    <!-- 工具条：视图 + 排序 -->
    <div class="toolbar">
      <div class="view-tabs">
        <button class="vtab active" data-view="list" data-i18n="view_list">列表</button>
        <button class="vtab" data-view="quadrant" data-i18n="view_quadrant">四象限</button>
        <button class="vtab" data-view="tree" data-i18n="view_tree">项目树</button>
      </div>
      <div class="sort-box">
        <select id="sortSelect" title="排序">
          <option value="priority" data-i18n="sort_priority">优先级</option>
          <option value="date" data-i18n="sort_date">日期</option>
          <option value="manual" data-i18n="sort_manual">手动</option>
        </select>
      </div>
    </div>

    <!-- 面包屑（项目树用） -->
    <div class="breadcrumb hidden" id="breadcrumb"></div>

    <!-- 主内容 -->
    <div class="content" id="content"></div>

    <!-- 搁置区展开条 -->
    <div class="deferred-bar" id="deferredBar">
      <span id="deferredToggle">▸ <span data-i18n="deferred_bar">暂缓搁置</span> (<span id="deferredCount">0</span>)</span>
    </div>
    <div class="deferred-list hidden" id="deferredList"></div>
  </div>

  <!-- 设置面板 -->
  <div class="modal hidden" id="settingsModal">
    <div class="modal-box">
      <div class="modal-head">
        <span data-i18n="settings">设置</span>
        <button class="tb-btn" id="btnCloseSettings">✕</button>
      </div>
      <div class="modal-body">
        <div class="set-row">
          <label data-i18n="set_language">语言 / Language</label>
          <select id="setLanguage">
            <option value="zh-CN">中文</option>
            <option value="en">English</option>
          </select>
        </div>
        <div class="set-row">
          <label data-i18n="set_viewmode">默认组织方式</label>
          <select id="setViewMode">
            <option value="list" data-i18n="view_list">列表</option>
            <option value="quadrant" data-i18n="view_quadrant">四象限</option>
            <option value="tree" data-i18n="view_tree">项目树</option>
          </select>
        </div>
        <div class="set-row">
          <label data-i18n="set_sortby">默认排序</label>
          <select id="setSortBy">
            <option value="priority" data-i18n="sort_priority">优先级</option>
            <option value="date" data-i18n="sort_date">日期</option>
            <option value="manual" data-i18n="sort_manual">手动</option>
          </select>
        </div>
        <div class="set-row">
          <label data-i18n="set_edge">贴边方向</label>
          <select id="setEdge">
            <option value="right" data-i18n="edge_right">右边</option>
            <option value="left" data-i18n="edge_left">左边</option>
            <option value="top" data-i18n="edge_top">顶部</option>
          </select>
        </div>
        <div class="set-row">
          <label data-i18n="set_autohide">贴边自动收起</label>
          <input type="checkbox" id="setAutoHide" />
        </div>
        <div class="set-row">
          <label data-i18n="set_alwaysontop">窗口置顶</label>
          <input type="checkbox" id="setAlwaysOnTop" />
        </div>
        <hr />
        <div class="set-row">
          <label data-i18n="set_backup">数据备份</label>
          <div>
            <button class="mini-btn" id="btnExport" data-i18n="btn_export">导出</button>
            <button class="mini-btn" id="btnImport" data-i18n="btn_import">导入</button>
          </div>
        </div>
        <div class="set-hint" data-i18n="data_hint">数据保存在本地：userData/tasklist-data.json</div>
        <hr />
        <div class="set-row">
          <button class="danger-btn" id="btnQuit" data-i18n="btn_quit">退出程序</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 任务编辑弹层 -->
  <div class="modal hidden" id="taskModal">
    <div class="modal-box">
      <div class="modal-head">
        <span id="taskModalTitle" data-i18n="task_edit">编辑任务</span>
        <button class="tb-btn" id="btnCloseTask">✕</button>
      </div>
      <div class="modal-body">
        <div class="set-row col">
          <label data-i18n="task_title">标题</label>
          <input type="text" id="editTitle" />
        </div>
        <div class="set-row">
          <label data-i18n="task_quadrant">四象限</label>
          <select id="editQuadrant">
            <option value="" data-i18n="q_none">无</option>
            <option value="IU" data-i18n="q_IU">① 重要且紧急</option>
            <option value="IN" data-i18n="q_IN">② 重要不紧急</option>
            <option value="NU" data-i18n="q_NU">③ 紧急不重要</option>
            <option value="NN" data-i18n="q_NN">④ 不重要不紧急</option>
          </select>
        </div>
        <div class="set-row">
          <label data-i18n="task_priority">优先级</label>
          <select id="editPriority">
            <option value="3" data-i18n="prio_3">紧急</option>
            <option value="2" data-i18n="prio_2">高</option>
            <option value="1" data-i18n="prio_1">中</option>
            <option value="0" data-i18n="prio_0">低</option>
          </select>
        </div>
        <div class="set-row">
          <label data-i18n="task_folder">所属目录</label>
          <select id="editFolder"></select>
        </div>
        <div class="set-row">
          <button class="mini-btn" id="btnDeferTask" data-i18n="btn_defer">搁置</button>
          <button class="mini-btn" id="btnActivateTask" data-i18n="btn_activate">恢复待办</button>
          <button class="danger-btn" id="btnDeleteTask" data-i18n="btn_delete">删除</button>
        </div>
      </div>
      <div class="modal-foot">
        <button class="primary-btn" id="btnSaveTask" data-i18n="btn_save">保存</button>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
